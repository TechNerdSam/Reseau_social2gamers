<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer's Hub - Connecte-toi, Joue, Partage !</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="navbar-left">
            <div class="logo">Gamer's Hub</div>
            <nav class="main-nav">
                <ul>
                    <li><a href="#" class="nav-item active"><i class="fas fa-home"></i> Accueil</a></li>
                    <li><a href="#" class="nav-item"><i class="fas fa-user"></i> Profil</a></li>
                    <li><a href="#" class="nav-item"><i class="fas fa-envelope"></i> Messages</a></li>
                    <li><a href="#" class="nav-item"><i class="fas fa-bell"></i> Notifications</a></li>
                </ul>
            </nav>
        </div>
        <div class="navbar-right">
            <div class="search-bar">
                <input type="text" placeholder="Rechercher des gamers, jeux...">
                <i class="fas fa-search search-icon"></i>
            </div>
            <button class="btn logout-btn"><i class="fas fa-sign-out-alt"></i> Déconnexion</button>
        </div>
    </header>

    <main class="container">
        <aside class="sidebar">
            <div class="sidebar-section trending-section">
                <h3><i class="fas fa-fire trending-icon"></i> Tendances Actuelles</h3>
                <ul class="trending-list">
                    <li><a href="#">#EpicWinMoments</a></li>
                    <li><a href="#">#NewGameRelease2025</a></li>
                    <li><a href="#">#EsportsHighlights</a></li>
                    <li><a href="#">#IndieGemHunt</a></li>
                </ul>
            </div>
            <div class="sidebar-section friends-online-section">
                <h3><i class="fas fa-users online-icon"></i> Amis en ligne</h3>
                <div class="online-friends-grid">
                    </div>
            </div>
        </aside>

        <section class="feed">
            <div class="post-creator-card">
                <div class="post-creator-header">
                    <div class="user-avatar">VG</div> <textarea id="post-text" placeholder="Partage ton dernier exploit, une astuce, ou une question à la communauté !"></textarea>
                </div>
                <div class="post-creator-actions">
                    <label for="post-media" class="btn media-btn">
                        <i class="fas fa-camera"></i> Ajouter Média
                        <input type="file" id="post-media" accept="image/*,video/*" class="hidden-input">
                    </label>
                    <button id="publish-post" class="btn primary-btn">Publier <i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <div id="posts-container" class="posts-container">
                <div class="loading-spinner">
                    <i class="fas fa-spinner fa-spin"></i> Chargement des posts...
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
